version: 2

models:
  - name: int_ga4__session_funnel
    description: >
      One row per session (session_key) with the first timestamp of each funnel
      step and ordered reached_<step> flags. Funnel: view_item → add_to_cart →
      begin_checkout → add_payment_info → purchase. A step is reached only if all
      earlier steps were reached and each step's first timestamp is >= the
      previous step's first timestamp. Sessions with a NULL session_key are
      excluded.
    data_tests:
      - funnel_steps_non_increasing:
          arguments:
            steps:
              - reached_view_item
              - reached_add_to_cart
              - reached_begin_checkout
              - reached_add_payment_info
              - reached_purchase
    columns:
      - name: session_key
        description: user_pseudo_id || '-' || ga_session_id.
        data_tests:
          - unique
          - not_null
      - name: user_pseudo_id
        description: Pseudonymous device/browser identifier of the session.
        data_tests:
          - not_null
      - name: session_start_date
        description: Earliest event_date in the session (export date, not UTC).
        data_tests:
          - not_null
      - name: first_view_item_ts
        description: First view_item timestamp in the session (any order).
      - name: first_add_to_cart_ts
        description: First add_to_cart timestamp in the session (any order).
      - name: first_begin_checkout_ts
        description: First begin_checkout timestamp in the session (any order).
      - name: first_add_payment_info_ts
        description: First add_payment_info timestamp in the session (any order).
      - name: first_purchase_ts
        description: First purchase timestamp in the session (any order).
      - name: reached_view_item
        description: Session has at least one view_item event.
      - name: reached_add_to_cart
        description: reached_view_item and first_add_to_cart_ts >= first_view_item_ts.
      - name: reached_begin_checkout
        description: reached_add_to_cart and first_begin_checkout_ts >= first_add_to_cart_ts.
      - name: reached_add_payment_info
        description: reached_begin_checkout and first_add_payment_info_ts >= first_begin_checkout_ts.
      - name: reached_purchase
        description: reached_add_payment_info and first_purchase_ts >= first_add_payment_info_ts.

  - name: int_ga4__user_checkout
    description: >
      One row per user_pseudo_id with at least one begin_checkout event in
      2020-11-01 to 2021-01-31, anchored on the user's first begin_checkout.
      Population for the primary KPI checkout_conversion_7d (see docs/metrics.md).
      All timestamps are UTC.
    columns:
      - name: user_pseudo_id
        description: Pseudonymous device/browser identifier.
        data_tests:
          - unique
          - not_null
      - name: first_begin_checkout_ts
        description: Timestamp of the user's first begin_checkout event.
        data_tests:
          - not_null
      - name: has_full_window
        description: >
          first_begin_checkout_ts < 2021-01-25 (UTC), i.e. the full 7-day
          follow-up window is inside the data range.
      - name: purchased_within_7d
        description: >
          The user has a purchase event with event_ts >= first_begin_checkout_ts
          and < first_begin_checkout_ts + 7 days. Sessions do not matter.
      - name: device_category
        description: device_category on the first begin_checkout event.
      - name: n_sessions_before_checkout
        description: >
          Number of observed sessions (from 2020-11-01) that started before the
          session containing the first begin_checkout. History before the data
          range is not visible.
