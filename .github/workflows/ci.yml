name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: pip install -r requirements-lock.txt

      - name: Run unit tests
        run: pytest python_tests

      - name: Parse dbt project (dummy profile, no GCP access)
        run: |
          mkdir -p "$RUNNER_TEMP/dbt-profile"
          cat > "$RUNNER_TEMP/dbt-profile/profiles.yml" <<'EOF'
          ga4_funnel_experiment:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: ci-placeholder-project
                dataset: ci_placeholder
                location: US
                threads: 1
          EOF
          dbt parse --profiles-dir "$RUNNER_TEMP/dbt-profile"
